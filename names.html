<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name game — Teaching Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141A18;--ink2:#4A554F;--ink3:#7C877F;--surface:#E9ECE7;--panel:#FFFFFF;
  --rule:#C6CEC6;--rule2:#DDE3DC;--green:#1E5C4A;--blue:#2A5C9A;--amber:#B57F0F;--red:#A63A2E;--radius:3px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:"IBM Plex Sans Condensed",sans-serif}
.mono{font-family:"IBM Plex Mono",monospace}
.masthead{background:var(--panel);border-bottom:1px solid var(--rule);padding:14px 20px}
.masthead-row{max-width:1100px;margin:0 auto;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.wordmark{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:22px;margin:0}
.wordmark span{color:var(--green)}
.masthead-sub{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.back{margin-left:auto}
.page{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.f label{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
select{padding:8px 10px;border:1px solid var(--rule);border-radius:var(--radius);background:#FCFDFC;font:inherit;font-size:14px;color:var(--ink)}
select:focus{outline:2px solid var(--blue);outline-offset:-1px}
.btn{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  cursor:pointer;padding:8px 13px;border-radius:var(--radius);border:1px solid var(--rule);background:var(--panel);color:var(--ink2);text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{color:#fff;border-color:var(--green)}

/* scoreboard */
.score{display:flex;gap:0;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--panel);margin-bottom:16px}
.score div{flex:1;padding:10px 14px;border-left:1px solid var(--rule2);text-align:center}
.score div:first-child{border-left:0}
.score .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.score .v{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:20px;margin-top:2px}

/* quiz */
.quiz{padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:18px}
.qphoto{width:220px;height:220px;object-fit:cover;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface)}
.qask{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px}
@media(max-width:560px){.choices{grid-template-columns:1fr}.qphoto{width:180px;height:180px}}
.choice{display:flex;align-items:center;gap:10px;text-align:left;width:100%;
  font:inherit;font-size:15px;color:var(--ink);cursor:pointer;
  padding:12px 14px;border:1px solid var(--rule);border-radius:var(--radius);background:#FCFDFC}
.choice:hover:not(:disabled){border-color:var(--ink3)}
.choice:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.choice:disabled{cursor:default}
.choice .num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);
  border:1px solid var(--rule);border-radius:2px;padding:1px 5px;flex:none}
.choice.right{background:var(--green);border-color:var(--green);color:#fff}
.choice.right .num{color:#fff;border-color:rgba(255,255,255,.5)}
.choice.wrong{background:var(--red);border-color:var(--red);color:#fff}
.choice.wrong .num{color:#fff;border-color:rgba(255,255,255,.5)}
.verdict{min-height:22px;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:16px}
.verdict.ok{color:var(--green)}
.verdict.no{color:var(--red)}
.hint{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);letter-spacing:.06em}

/* round summary */
.missed{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:640px}
.missed figure{margin:0;width:88px;text-align:center}
.missed img{width:88px;height:88px;object-fit:cover;border:1px solid var(--rule);border-radius:var(--radius)}
.missed figcaption{font-size:12.5px;margin-top:5px;line-height:1.35}

.panel-head{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.panel-head h2{font-size:18px;margin:0}
.count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);letter-spacing:.1em}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--rule2);padding:8px 10px;text-align:left}
th{background:#F3F6F2;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
td.num{font-family:"IBM Plex Mono",monospace}
.bad{color:var(--red);font-weight:600}
.empty{padding:22px 14px;color:var(--ink3);font-size:13px;line-height:1.6}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 12px;border:1px solid var(--rule);border-radius:14px;background:var(--panel);
  cursor:pointer;font-size:12.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
/* survey question presentation */
.qquestion{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:17px;
  line-height:1.4;text-align:center;max-width:640px}
.qquote{margin:0;max-width:640px;background:var(--surface);border-left:3px solid var(--green);
  border-radius:0 var(--radius) var(--radius) 0;padding:14px 18px;font-size:15.5px;line-height:1.6;
  white-space:pre-wrap}
.qwho{display:flex;flex-direction:column;align-items:center;gap:8px}
.qphoto.small{width:110px;height:110px}
.qname{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:19px}
.choices.one{grid-template-columns:1fr;max-width:640px}
.choice.long{align-items:flex-start;line-height:1.5}
.choice.long .num{margin-top:2px}
.missed .nophoto{width:88px;height:88px;border:1px solid var(--rule);border-radius:var(--radius);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:30px;color:var(--ink3)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-row">
    <h1 class="wordmark">Name<span>Game</span></h1>
    <span class="masthead-sub">Learn your roster</span>
    <a class="btn back" href="index.html">← Back to the workspace</a>
  </div>
</header>

<main class="page">
  <div class="bar">
    <div class="f">
      <label for="courseSel">Course</label>
      <select id="courseSel"></select>
    </div>
    <button class="btn" id="newRound">New round</button>
    <button class="btn" id="resetStats">Reset all-time stats</button>
  </div>

  <div class="modes chips" id="modes"></div>

  <div class="score" id="score" hidden>
    <div><div class="k">Round</div><div class="v" id="sProgress">–</div></div>
    <div><div class="k">Correct</div><div class="v" id="sCorrect">–</div></div>
    <div><div class="k">Streak</div><div class="v" id="sStreak">–</div></div>
  </div>

  <div class="card" id="stage"></div>

  <div class="panel-head">
    <h2>Trouble spots</h2>
    <span class="count" id="statCount"></span>
  </div>
  <div class="card" id="stats" style="overflow-x:auto"></div>
</main>

<script>
/* ============================ storage ============================ */
var KEY = 'bench-v1';
var mem = null;
function readRaw(){
  try{ var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return mem; }
}
function writeRaw(o){ mem = o; try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
var DB = readRaw() || {};
DB.courses  = DB.courses  || [];
DB.students = DB.students || [];
DB.namegame = DB.namegame || {};
DB.survey   = DB.survey   || {columns:[]};
DB.groups   = DB.groups   || [];
function save(){ writeRaw(DB); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ============================ round state ============================ */
var mode = 'photos';   /* photos | survey | mixed */
var queue = [];        /* [{sid, want}] still to ask this round */
var roundLen = 0;
var correct = 0;
var streak = 0;
var best = 0;
var missed = [];       /* [{sid, want}] missed this round */
var currentQ = null;
var locked = false;

var courseSel = document.getElementById('courseSel');
var stage = document.getElementById('stage');

function studentsFor(cid){
  return DB.students.filter(function(s){ return s.course === cid; });
}
function withPhotos(list){ return list.filter(function(s){ return !!s.photo; }); }
function byId(id){ return DB.students.filter(function(s){ return s.id === id; })[0]; }
function nameOf(s){ return (s && s.name) || 'Unnamed student'; }

function surveyColsFor(cid){
  return ((DB.survey && DB.survey.columns) || []).filter(function(c){ return c.course === cid; });
}

/* Lab groups, entered by hand on the Lab groups tab. */
function groupOf(sid){
  return (DB.groups || []).filter(function(g){ return g.members.indexOf(sid) > -1; })[0] || null;
}
function groupmatesOf(sid){
  var g = groupOf(sid);
  return g ? g.members.filter(function(m){ return m !== sid && byId(m); }) : [];
}

/* Answers that decline to say anything. Two tiers on purpose: DECLINE applies
   everywhere, SOFT only to free-text questions — on a menu question picking
   "No" is a real answer, but typing "No" under "anything else?" is not.
   Deliberately not a length rule: "Radio", "Robots" and "she/her" are short
   and are exactly what the game should be asking about. */
var DECLINE = ['na','n/a','n/a.','notapplicable','none','nothing','nil','null','nonwe'];
var SOFT = ['no','nope','nothingreally','nothingelse','nothingtoadd','nothingatall',
            'allgood','imgood','iamgood','nothanks','nothankyou','thankyou','thanks',
            'thankssomuch','thanksverymuch','idk','notsure','notreally','nothingcomestomind'];

function normAns(v){ return String(v == null ? '' : v).toLowerCase().replace(/[^a-z0-9/]/g, ''); }
function firstChunk(v){ return String(v == null ? '' : v).split(/[,;.!\n]/)[0]; }

function isDecline(v){
  var s = String(v == null ? '' : v).trim();
  if(!s) return true;
  if(!/[a-z0-9]/i.test(s)) return true;                 /* punctuation only */
  if(DECLINE.indexOf(normAns(s)) > -1) return true;
  /* catches "none, thx" and "n/a - nothing to add" without touching real prose */
  if(s.length <= 24 && DECLINE.indexOf(normAns(firstChunk(s))) > -1) return true;
  return false;
}
function isNonAnswer(v){
  if(isDecline(v)) return true;
  var s = String(v == null ? '' : v).trim();
  if(SOFT.indexOf(normAns(s)) > -1) return true;
  if(s.length <= 24 && SOFT.indexOf(normAns(firstChunk(s))) > -1) return true;
  return false;
}
function isSubstantive(v, kind){
  return kind === 'who' ? !isNonAnswer(v) : !isDecline(v);
}

/* Only columns where this student actually said something — there is nothing
   to remember about a student who answered "N/A". */
function colsAnsweredBy(sid, cid){
  return surveyColsFor(cid).filter(function(c){
    var v = c.responses && c.responses[sid];
    return v && isSubstantive(v, c.kind);
  });
}

function shuffle(a){
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function sample(arr, n, exclude){
  var pool = arr.filter(function(x){ return exclude.indexOf(x) === -1; });
  return shuffle(pool.slice()).slice(0, n);
}

function fillCourses(){
  courseSel.innerHTML = '';
  if(!DB.courses.length){
    var o = document.createElement('option');
    o.value = ''; o.textContent = 'No courses yet';
    courseSel.appendChild(o);
    return;
  }
  DB.courses.forEach(function(c){
    var op = document.createElement('option');
    op.value = c.id;
    op.textContent = (c.code || c.title || 'Course') + (c.term ? ' · ' + c.term : '');
    courseSel.appendChild(op);
  });
}

/* ============================ scoring ============================ */
function stat(id){
  DB.namegame[id] = DB.namegame[id] || {r:0, w:0};
  return DB.namegame[id];
}
function record(id, wasRight){
  var st = stat(id);
  if(wasRight) st.r++; else st.w++;
  save();
}
function updateScore(){
  var box = document.getElementById('score');
  if(!roundLen){ box.hidden = true; return; }
  box.hidden = false;
  document.getElementById('sProgress').textContent =
    Math.min(roundLen - queue.length, roundLen) + ' / ' + roundLen;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sStreak').textContent = streak + (best > streak ? ' (best ' + best + ')' : '');
}

/* ============================ building questions ============================ */
/* A round is one question per eligible student, so every student comes up once
   however the modes are mixed. */
function buildPool(cid){
  var out = [];
  studentsFor(cid).forEach(function(s){
    var hasPhoto = !!s.photo;
    var hasSurvey = colsAnsweredBy(s.id, cid).length > 0;
    var hasGroup = groupmatesOf(s.id).length > 0;
    if(mode === 'photos'){ if(hasPhoto) out.push({sid:s.id, want:'photo'}); }
    else if(mode === 'survey'){ if(hasSurvey) out.push({sid:s.id, want:'survey'}); }
    else if(mode === 'groups'){ if(hasGroup) out.push({sid:s.id, want:'group'}); }
    else {
      var opts = [];
      if(hasPhoto) opts.push('photo');
      if(hasSurvey) opts.push('survey');
      if(hasGroup) opts.push('group');
      if(opts.length) out.push({sid:s.id, want: opts[Math.floor(Math.random() * opts.length)]});
    }
  });
  return out;
}

function buildQuestion(item, cid){
  var s = byId(item.sid);
  if(!s) return null;
  var others = studentsFor(cid).filter(function(x){ return x.id !== s.id && x.name; });

  if(item.want === 'photo'){
    if(!s.photo) return null;
    var picks = sample(others.map(function(x){ return x.id; }), 3, []);
    return {
      type: 'photo', sid: s.id,
      photo: s.photo,
      ask: 'Who is this?',
      choices: shuffle(picks.concat([s.id])).map(function(id){
        return { key:id, label:nameOf(byId(id)), correct:id === s.id };
      })
    };
  }

  if(item.want === 'group'){
    var mates = groupmatesOf(s.id);
    if(!mates.length) return null;
    /* Every groupmate must be excluded from the distractors, or a three-person
       group can put two correct answers on screen. */
    var mine = groupOf(s.id);
    var outsiders = others.filter(function(x){ return mine.members.indexOf(x.id) === -1; });
    if(!outsiders.length) return null;
    var mate = mates[Math.floor(Math.random() * mates.length)];
    var wrongIds = sample(outsiders.map(function(x){ return x.id; }), 3, []);
    return {
      type: 'group', sid: s.id,
      photo: s.photo || '',
      who: nameOf(s),
      ask: mates.length > 1 ? 'Who else is in their group?' : 'Who is their lab partner?',
      choices: shuffle(wrongIds.concat([mate])).map(function(id){
        return { key:id, label:nameOf(byId(id)), correct:id === mate };
      })
    };
  }

  var cols = colsAnsweredBy(s.id, cid);
  if(!cols.length) return null;
  var col = cols[Math.floor(Math.random() * cols.length)];
  var mine = col.responses[s.id];

  if(col.kind === 'who'){
    /* Distractors must be students who also answered substantively, otherwise
       the right answer is the only plausible one. */
    var answered = others.filter(function(x){
      return col.responses[x.id] && isSubstantive(col.responses[x.id], 'who');
    });
    var pool = answered.length >= 3 ? answered : others;
    var ids = sample(pool.map(function(x){ return x.id; }), 3, []);
    return {
      type: 'who', sid: s.id, colId: col.id,
      quote: mine,
      ask: col.text,
      choices: shuffle(ids.concat([s.id])).map(function(id){
        return { key:id, label:nameOf(byId(id)), correct:id === s.id };
      })
    };
  }

  /* kind === 'what': offer distinct answer values from this column. */
  var values = [];
  Object.keys(col.responses).forEach(function(k){
    var v = col.responses[k];
    if(isDecline(v)) return;                 /* never offer "N/A" as a choice */
    if(values.indexOf(v) === -1) values.push(v);
  });
  if(values.indexOf(mine) === -1) values.push(mine);
  if(values.length < 2) return null;
  var wrong = sample(values, 3, [mine]);
  return {
    type: 'what', sid: s.id, colId: col.id,
    photo: s.photo || '',
    who: nameOf(s),
    ask: col.text,
    choices: shuffle(wrong.concat([mine])).map(function(v){
      return { key:v, label:v, correct:v === mine };
    })
  };
}

/* ============================ round flow ============================ */
function startRound(items){
  var cid = courseSel.value;
  queue = shuffle(items ? items.slice() : buildPool(cid));
  roundLen = queue.length;
  correct = 0; streak = 0; best = 0; missed = []; currentQ = null; locked = false;
  nextQuestion();
}

function nextQuestion(){
  locked = false;
  var cid = courseSel.value;
  while(queue.length){
    var item = queue.shift();
    var q = buildQuestion(item, cid);
    if(q){ q.item = item; currentQ = q; renderQuestion(); updateScore(); return; }
    /* Unbuildable question (data changed mid-round) — shrink the round. */
    roundLen--;
  }
  currentQ = null; renderRoundEnd(); updateScore();
}

function answer(choiceKey){
  if(locked || !currentQ) return;
  locked = true;
  var picked = currentQ.choices.filter(function(c){ return c.key === choiceKey; })[0];
  var right = !!(picked && picked.correct);
  if(right){ correct++; streak++; if(streak > best) best = streak; }
  else { streak = 0; missed.push(currentQ.item); }
  record(currentQ.sid, right);
  renderQuestion(choiceKey);
  updateScore();
  renderStats();
}

/* ============================ rendering ============================ */
function modeAvailability(cid){
  var roster = studentsFor(cid);
  return {
    total: roster.length,
    photos: withPhotos(roster).length,
    survey: roster.filter(function(s){ return colsAnsweredBy(s.id, cid).length; }).length,
    groups: roster.filter(function(s){ return groupmatesOf(s.id).length; }).length,
    questions: surveyColsFor(cid).length
  };
}

function renderModes(){
  var box = document.getElementById('modes');
  var cid = courseSel.value;
  var av = modeAvailability(cid);
  box.innerHTML = '';
  [['photos','Photos', av.photos],
   ['survey','Survey', av.survey],
   ['groups','Groups', av.groups],
   ['mixed','Mixed', Math.max(av.photos, av.survey, av.groups)]].forEach(function(m){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.setAttribute('aria-pressed', mode === m[0] ? 'true' : 'false');
    b.textContent = m[1] + ' (' + m[2] + ')';
    b.disabled = !m[2];
    b.title = m[2] ? m[2] + ' students available in this mode' : 'Nothing loaded for this mode yet';
    b.onclick = function(){ mode = m[0]; renderStage(); renderModes(); };
    box.appendChild(b);
  });
}

function renderStage(){
  var cid = courseSel.value;
  var score = document.getElementById('score');
  function empty(msg){
    stage.innerHTML = '<div class="empty">' + msg + '</div>';
    score.hidden = true;
    roundLen = 0; currentQ = null;
  }
  if(!cid) return empty('Add a course on the Courses tab first, then assign students to it.');
  var roster = studentsFor(cid);
  if(!roster.length) return empty('No students are assigned to this course yet. ' +
    'Add them on the Students tab and set their Course field.');

  var av = modeAvailability(cid);
  if(mode === 'photos' && !av.photos) return empty('None of the ' + roster.length +
    ' students in this course have a photo yet. Use <strong>Import roster</strong> on the Students tab, ' +
    'or add photos one at a time with the Photo field.');
  if(mode === 'photos' && av.photos < 2) return empty('Only one student has a photo, ' +
    'so there is nothing to tell apart yet. Add a photo to at least one more student.');
  if(mode === 'survey' && !av.questions) return empty('No survey has been loaded for this course. ' +
    'Use <strong>Import survey</strong> on the Students tab to attach responses.');
  if(mode === 'survey' && !av.survey) return empty('A survey is loaded, but none of its responses ' +
    'matched a student on this course’s roster.');
  if(mode === 'groups' && !av.groups) return empty('No lab groups have been set up for this course yet. ' +
    'Use the <strong>Lab groups</strong> tab to build them — click two or three faces, then ' +
    '<strong>Make a group</strong>.');
  if(mode === 'mixed' && !av.photos && !av.survey && !av.groups)
    return empty('Load photos, a survey, or lab groups first.');

  startRound();
}

function choiceButton(c, i, n, isLong){
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'choice' + (isLong ? ' long' : '');
  b.innerHTML = '<span class="num">' + (i + 1) + '</span><span>' + esc(c.label) + '</span>';
  return b;
}

function renderQuestion(pickedKey){
  var q = currentQ;
  var box = document.createElement('div');
  box.className = 'quiz';

  if(q.type === 'photo'){
    var img = document.createElement('img');
    img.className = 'qphoto';
    img.src = q.photo;
    /* Never the name — the alt text must not give the answer away. */
    img.alt = 'Photo of the student you are being asked to name';
    box.appendChild(img);
    var a1 = document.createElement('div');
    a1.className = 'qask'; a1.textContent = q.ask;
    box.appendChild(a1);
  }
  else if(q.type === 'who'){
    var ctx = document.createElement('div');
    ctx.className = 'qask'; ctx.textContent = 'Who gave this answer?';
    box.appendChild(ctx);
    var qq = document.createElement('div');
    qq.className = 'qquestion'; qq.textContent = q.ask;
    box.appendChild(qq);
    var quote = document.createElement('blockquote');
    quote.className = 'qquote'; quote.textContent = q.quote;
    box.appendChild(quote);
  }
  else { /* what, or group — both name the student and ask about them */
    var whoWrap = document.createElement('div');
    whoWrap.className = 'qwho';
    if(q.photo){
      var im2 = document.createElement('img');
      im2.className = 'qphoto small'; im2.src = q.photo; im2.alt = '';
      whoWrap.appendChild(im2);
    }
    var nm = document.createElement('div');
    nm.className = 'qname'; nm.textContent = q.who;
    whoWrap.appendChild(nm);
    box.appendChild(whoWrap);
    if(q.type === 'what'){
      var a3 = document.createElement('div');
      a3.className = 'qask'; a3.textContent = 'How did they answer?';
      box.appendChild(a3);
      var qq3 = document.createElement('div');
      qq3.className = 'qquestion'; qq3.textContent = q.ask;
      box.appendChild(qq3);
    } else {
      var ag = document.createElement('div');
      ag.className = 'qquestion'; ag.textContent = q.ask;
      box.appendChild(ag);
    }
  }

  var longChoices = q.choices.some(function(c){ return String(c.label).length > 34; });
  var choices = document.createElement('div');
  choices.className = 'choices' + (longChoices ? ' one' : '');
  q.choices.forEach(function(c, i){
    var b = choiceButton(c, i, q.choices.length, longChoices);
    if(locked){
      b.disabled = true;
      if(c.correct) b.className += ' right';
      else if(c.key === pickedKey) b.className += ' wrong';
    } else {
      b.onclick = function(){ answer(c.key); };
    }
    choices.appendChild(b);
  });
  box.appendChild(choices);

  var verdict = document.createElement('div');
  verdict.className = 'verdict';
  verdict.setAttribute('role','status');
  verdict.setAttribute('aria-live','polite');
  if(locked){
    var pick = q.choices.filter(function(c){ return c.key === pickedKey; })[0];
    var wasRight = !!(pick && pick.correct);
    var truth = q.choices.filter(function(c){ return c.correct; })[0];
    verdict.className += wasRight ? ' ok' : ' no';
    if(wasRight) verdict.textContent = 'Correct';
    else {
      var lead = q.type === 'what' ? 'They answered: '
               : q.type === 'group' ? 'They work with ' : 'That was ';
      verdict.textContent = lead + (truth ? truth.label : '');
    }
  }
  box.appendChild(verdict);

  if(locked){
    var next = document.createElement('button');
    next.type = 'button'; next.className = 'btn primary'; next.id = 'nextBtn';
    next.textContent = queue.length ? 'Next' : 'Finish round';
    next.onclick = nextQuestion;
    box.appendChild(next);
  }

  var hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = locked ? 'Enter or Space for the next one'
                            : 'Press 1–' + q.choices.length + ' to answer';
  box.appendChild(hint);

  stage.innerHTML = '';
  stage.appendChild(box);
  if(locked){ var nb = document.getElementById('nextBtn'); if(nb) nb.focus(); }
}

function renderRoundEnd(){
  var pct = roundLen ? Math.round(correct / roundLen * 100) : 0;
  var box = document.createElement('div');
  box.className = 'quiz';

  var h = document.createElement('h2');
  h.style.margin = '0';
  h.textContent = roundLen ? correct + ' of ' + roundLen + ' — ' + pct + '%' : 'Nothing to ask';
  box.appendChild(h);

  var sub = document.createElement('div');
  sub.className = 'qask';
  sub.textContent = missed.length ? missed.length + ' to work on' : (roundLen ? 'Clean round' : '');
  box.appendChild(sub);

  if(missed.length){
    var grid = document.createElement('div');
    grid.className = 'missed';
    var seen = {};
    missed.forEach(function(it){
      if(seen[it.sid]) return;
      seen[it.sid] = 1;
      var s = byId(it.sid);
      if(!s) return;
      var fig = document.createElement('figure');
      if(s.photo){
        var im = document.createElement('img'); im.src = s.photo; im.alt = '';
        fig.appendChild(im);
      } else {
        var ph = document.createElement('div');
        ph.className = 'nophoto'; ph.textContent = (s.name || '?').slice(0,1);
        fig.appendChild(ph);
      }
      var cap = document.createElement('figcaption');
      cap.textContent = nameOf(s);
      fig.appendChild(cap);
      grid.appendChild(fig);
    });
    box.appendChild(grid);
  }

  var row = document.createElement('div');
  row.style.display = 'flex'; row.style.gap = '10px'; row.style.flexWrap = 'wrap';
  if(missed.length){
    var again = document.createElement('button');
    again.type = 'button'; again.className = 'btn primary'; again.id = 'nextBtn';
    again.textContent = 'Practice these ' + missed.length;
    var toRedo = missed.slice();
    again.onclick = function(){ startRound(toRedo); };
    row.appendChild(again);
  }
  var fresh = document.createElement('button');
  fresh.type = 'button';
  fresh.className = 'btn' + (missed.length ? '' : ' primary');
  if(!missed.length) fresh.id = 'nextBtn';
  fresh.textContent = 'New round';
  fresh.onclick = function(){ startRound(); };
  row.appendChild(fresh);
  box.appendChild(row);

  stage.innerHTML = '';
  stage.appendChild(box);
  var f = document.getElementById('nextBtn');
  if(f) f.focus();
}

function renderStats(){
  var box = document.getElementById('stats');
  var cid = courseSel.value;
  box.innerHTML = '';
  var roster = studentsFor(cid).filter(function(s){
    var st = DB.namegame[s.id];
    return st && (st.r || st.w);
  });
  document.getElementById('statCount').textContent =
    roster.length ? roster.length + ' with history' : '';
  if(!roster.length){
    box.innerHTML = '<div class="empty">Once you have answered a few, the names you keep missing collect here.</div>';
    return;
  }
  roster.sort(function(a, b){
    var sa = DB.namegame[a.id], sb = DB.namegame[b.id];
    return (sa.r / (sa.r + sa.w)) - (sb.r / (sb.r + sb.w));
  });
  var tbl = document.createElement('table');
  tbl.innerHTML = '<thead><tr><th>Student</th><th>Right</th><th>Wrong</th><th>Accuracy</th></tr></thead>';
  var tb = document.createElement('tbody');
  roster.forEach(function(s){
    var st = DB.namegame[s.id];
    var pct = Math.round(st.r / (st.r + st.w) * 100);
    var tr = document.createElement('tr');
    tr.innerHTML = '<td>' + esc(nameOf(s)) + '</td>' +
      '<td class="num">' + st.r + '</td>' +
      '<td class="num">' + st.w + '</td>' +
      '<td class="num' + (pct < 70 ? ' bad' : '') + '">' + pct + '%</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  box.appendChild(tbl);
}

/* ============================ events ============================ */
document.addEventListener('keydown', function(e){
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(locked || !currentQ){
    if(e.key === 'Enter' || e.key === ' '){
      var n = document.getElementById('nextBtn');
      if(n){ e.preventDefault(); n.click(); }
    }
    return;
  }
  var i = parseInt(e.key, 10);
  if(i >= 1 && i <= currentQ.choices.length){
    e.preventDefault();
    answer(currentQ.choices[i - 1].key);
  }
});

document.getElementById('newRound').onclick = function(){ renderStage(); };
document.getElementById('resetStats').onclick = function(){
  DB.namegame = {};
  save();
  renderStats();
};
/* Land on a mode that actually has something in it, rather than showing an
   empty Photos tab to someone who has only loaded a survey. */
function pickInitialMode(){
  var av = modeAvailability(courseSel.value);
  if(av.photos >= 2) mode = 'photos';
  else if(av.survey) mode = 'survey';
  else if(av.groups) mode = 'groups';
  else mode = 'photos';
}

courseSel.onchange = function(){ pickInitialMode(); renderModes(); renderStage(); renderStats(); };

fillCourses();
pickInitialMode();
renderModes();
renderStage();
renderStats();
</script>
