<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teaching Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141A18;
  --ink2:#4A554F;
  --ink3:#7C877F;
  --surface:#E9ECE7;
  --panel:#FFFFFF;
  --rule:#C6CEC6;
  --rule2:#DDE3DC;
  --green:#1E5C4A;
  --blue:#2A5C9A;
  --amber:#B57F0F;
  --red:#A63A2E;
  --radius:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.cond{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif}
.mono,input[type=date],.tick-num{font-family:"IBM Plex Mono",monospace}

/* ---------- masthead ---------- */
.masthead{
  border-bottom:1px solid var(--rule);
  background:var(--panel);
  padding:14px 20px 0;
}
.masthead-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.wordmark{
  font-family:"IBM Plex Sans Condensed",sans-serif;
  font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0;
}
.wordmark span{color:var(--green)}
.masthead-sub{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink3);
}
.masthead-tools{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- channel rail (tabs) ---------- */
.rail-wrap{background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
.rail{
  max-width:1400px;margin:0 auto;padding:0 12px;
  display:flex;gap:0;overflow-x:auto;scrollbar-width:thin;
}
.rail::-webkit-scrollbar{height:4px}
.rail::-webkit-scrollbar-thumb{background:var(--rule)}
.chan{
  position:relative;flex:0 0 auto;background:none;border:0;cursor:pointer;
  padding:12px 16px 14px;color:var(--ink2);
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;
  font-size:13px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;
}
.chan::before{ /* tick mark on the axis */
  content:"";position:absolute;left:0;bottom:0;width:1px;height:7px;background:var(--rule);
}
.chan:first-child::before{display:none}
.chan:hover{color:var(--ink)}
.chan[aria-selected="true"]{color:var(--green)}
.chan[aria-selected="true"]::after{ /* peak cursor */
  content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);
  width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-bottom:6px solid var(--green);
}
.chan:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}

/* ---------- layout ---------- */
.page{max-width:1400px;margin:0 auto;padding:22px 20px 60px}
.panel-head{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.panel-head h2{font-size:19px;font-weight:600;margin:0;letter-spacing:.01em}
.panel-head .count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);letter-spacing:.1em}
.panel-head .spacer{flex:1}

.split{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.split{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius)}
.list{max-height:70vh;overflow:auto}
.row{
  display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--rule2);padding:11px 13px;cursor:pointer;font:inherit;color:inherit;
}
.row:last-child{border-bottom:0}
.row:hover{background:#F3F6F2}
.row[aria-current="true"]{background:#EDF3F0;box-shadow:inset 3px 0 0 var(--green)}
.row-t{font-weight:600;font-size:14px}
.row-s{font-size:12px;color:var(--ink3);margin-top:2px}
.empty{padding:22px 14px;color:var(--ink3);font-size:13px}

.detail{padding:18px}
.field{margin-bottom:14px}
.field label{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:5px;
}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=email],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:var(--radius);
  background:#FCFDFC;font:inherit;font-size:14px;color:var(--ink);
}
textarea{min-height:88px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* photo field */
.photofield{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.photo-preview{width:72px;height:72px;object-fit:cover;border:1px solid var(--rule);border-radius:var(--radius);background:#FCFDFC}
.photo-ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.photo-ctrls input[type=file]{font:inherit;font-size:12px;max-width:210px}
.photo-note{flex-basis:100%;font-size:11.5px;color:var(--ink3);line-height:1.5}

/* roster import */
.imp{padding:4px 0}
.imp-step{padding:16px 18px;border-bottom:1px solid var(--rule2)}
.imp-step:last-child{border-bottom:0}
.imp-step h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:9px}
.imp-step .stepn{display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;flex:none}
.imp-step .opt{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);font-weight:400}
.imp-help{margin:0 0 10px;font-size:12.5px;color:var(--ink2);line-height:1.6;max-width:70ch}
.imp-help code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--surface);
  padding:1px 4px;border-radius:2px}
.imp-step textarea{min-height:110px;margin-bottom:10px}
.imp-step input[type=file]{font:inherit;font-size:12px;display:block;margin-top:4px}
.imp-prog{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink3);margin-left:12px}
.imp-warn{background:#FBF3E0;border:1px solid var(--amber);border-radius:var(--radius);
  padding:10px 14px;font-size:13px;color:#6B4B08;margin-bottom:12px;line-height:1.55}
.imp-table{width:100%;border-collapse:collapse;font-size:13px}
.imp-table th,.imp-table td{border:1px solid var(--rule2);padding:7px 10px;text-align:left;vertical-align:middle}
.imp-table th{background:#F3F6F2;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.imp-thumb{width:40px;height:40px;object-fit:cover;border:1px solid var(--rule);border-radius:2px;display:block}
.imp-nophoto{color:var(--ink3);font-family:"IBM Plex Mono",monospace;font-size:12px}
.imp-sel{max-width:210px;font-size:12.5px;padding:5px 7px}
.imp-table tr.leaky td{background:#FDFBF4}
.imp-foot{display:flex;align-items:center;gap:4px;margin-top:14px;flex-wrap:wrap}

/* checklist field */
.checks{border:1px solid var(--rule);border-radius:var(--radius);background:#FCFDFC}
.check{display:flex;gap:9px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--rule2)}
.check:last-of-type{border-bottom:0}
.check input[type=text]{border:0;background:none;padding:2px 0}
.check input[type=checkbox]{width:15px;height:15px;accent-color:var(--green);flex:0 0 auto}
.check.done input[type=text]{color:var(--ink3);text-decoration:line-through}
.check .x{background:none;border:0;color:var(--ink3);cursor:pointer;font-size:15px;padding:0 3px;line-height:1}
.check .x:hover{color:var(--red)}

/* buttons */
button.btn{
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;cursor:pointer;
  padding:7px 13px;border-radius:var(--radius);border:1px solid var(--rule);
  background:var(--panel);color:var(--ink2);
}
button.btn:hover{border-color:var(--ink3);color:var(--ink)}
button.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
button.btn.primary:hover{background:#17493A}
button.btn.danger{color:var(--red);border-color:#E0C7C3}
button.btn.danger:hover{background:#FBF1F0}
button.btn:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule2)}

.pill{
  display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 7px;border-radius:10px;border:1px solid var(--rule);color:var(--ink2);
}
.pill.ok{color:var(--green);border-color:#B6D2C7;background:#F0F7F4}
.pill.warn{color:var(--amber);border-color:#E7D6A8;background:#FBF6E9}
.pill.hot{color:var(--red);border-color:#E5C6C1;background:#FCF1EF}

/* settings drawer */
.drawer{display:none;background:var(--panel);border-bottom:1px solid var(--rule);padding:14px 20px}
.drawer.open{display:block}
.drawer-inner{max-width:1400px;margin:0 auto}
.drawer h3{font-size:13px;margin:0 0 4px;letter-spacing:.04em}
.drawer p{font-size:12px;color:var(--ink3);margin:0 0 10px}
.tabtoggles{display:flex;flex-wrap:wrap;gap:6px 16px}
.tabtoggles label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.tabtoggles input{accent-color:var(--green)}

/* to-do */
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-bottom:1px solid var(--rule2)}
.todo:last-child{border-bottom:0}
.todo input[type=checkbox]{width:16px;height:16px;margin-top:2px;accent-color:var(--green)}
.todo.done .todo-t{color:var(--ink3);text-decoration:line-through}
.todo-t{font-size:14px}
.todo-m{font-size:11px;color:var(--ink3);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap}
.addbar{display:flex;gap:8px;padding:12px 13px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.addbar input[type=text]{flex:1 1 220px}
.addbar select,.addbar input[type=date]{flex:0 0 auto;width:auto}

/* plans */
.gridtable{width:100%;border-collapse:collapse;font-size:13px}
.gridtable th,.gridtable td{border:1px solid var(--rule2);padding:0;vertical-align:top}
.gridtable th{
  background:#F3F6F2;padding:7px 9px;text-align:left;font-family:"IBM Plex Sans Condensed",sans-serif;
  font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600;
}
.gridtable td input{border:0;background:none;border-radius:0;padding:8px 9px;font-size:13px}
.gridtable td input:focus{outline:2px solid var(--blue);outline-offset:-2px}
.wk{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);
  background:#F7F9F6;padding:8px 9px;white-space:nowrap;
}
.wk.now{color:var(--green);font-weight:600;background:#EDF3F0}
.daycols{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule2);border:1px solid var(--rule)}
@media(max-width:760px){.daycols{grid-template-columns:1fr}}
.daycol{background:var(--panel);padding:10px}
.daycol h4{margin:0 0 6px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.daycol textarea{min-height:120px;border:0;background:none;padding:0;font-size:13px}
.monthgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}

/* digest */
.artcard{padding:13px;border-bottom:1px solid var(--rule2)}
.artcard:last-child{border-bottom:0}
.artcard h4{margin:0 0 4px;font-size:14.5px;font-weight:600;line-height:1.35}
.artcard h4 a{color:var(--ink);text-decoration:none}
.artcard h4 a:hover{color:var(--blue);text-decoration:underline}
.artmeta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);display:flex;gap:10px;flex-wrap:wrap}
.heart{background:none;border:0;cursor:pointer;font-size:15px;color:var(--rule);padding:0 2px}
.heart.on{color:var(--red)}
.artcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.artcard>h4{grid-column:1;grid-row:1;margin:0}
.artcard>.artmeta{grid-column:1;grid-row:2}
.artacts{grid-column:2;grid-row:1 / span 2;align-self:center;display:flex;gap:2px;align-items:center}
@media(max-width:520px){
  .artcard{grid-template-columns:minmax(0,1fr)}
  .artacts{grid-column:1;grid-row:3;justify-content:flex-start;margin-top:4px}
}
.mbtn{background:none;border:1px solid transparent;border-radius:var(--radius);cursor:pointer;
  font-size:14px;line-height:1;color:var(--rule);padding:4px 7px}
.mbtn:hover{border-color:var(--rule);color:var(--ink3)}
.mbtn:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.mbtn.read.on{background:var(--green);border-color:var(--green);color:#fff}
.mbtn.skip.on{background:var(--ink3);border-color:var(--ink3);color:#fff}
.mbtn.heart.on{color:var(--red)}
.mbtn.heart.on:hover{color:var(--red)}
/* A read paper stays visible but recedes; not-interested is dimmer still. */
.artcard.isread h4 a{color:var(--ink3);font-weight:500}
.artcard.isread .artmeta{opacity:.7}
.artcard.isskip{opacity:.5}
.artcard.isskip h4 a{text-decoration:line-through;color:var(--ink3)}
.chip.pre{border-style:dashed}
.chip.pre[aria-pressed="true"]{border-style:solid;background:var(--blue);border-color:var(--blue)}
.hiddenbar{display:block;width:100%;text-align:center;background:none;border:0;
  border-top:1px solid var(--rule2);cursor:pointer;padding:9px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3)}
.hiddenbar:hover{color:var(--ink);background:#F7F9F6}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{
  padding:5px 11px;border:1px solid var(--rule);border-radius:14px;background:var(--panel);
  cursor:pointer;font-size:12.5px;color:var(--ink2);
}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.srcrow{display:flex;gap:8px;margin-bottom:8px}
.srcrow input{flex:1}
.note{font-size:12px;color:var(--ink3);margin-top:8px}
.linkout{color:var(--blue);font-weight:500}

.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:12px;background:#fff;padding:8px;z-index:99}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="masthead-row">
    <h1 class="wordmark">Teaching&nbsp;<span>Workspace</span></h1>
    <span class="masthead-sub">Notre Dame Physics · Advanced Labs</span>
    <div class="masthead-tools">
      <button class="btn" id="settingsBtn" aria-expanded="false">⚙ Tabs</button>
      <button class="btn" id="exportBtn">Export</button>
      <button class="btn" id="importBtn">Import</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </div>
  <div class="rail-wrap" style="border:0;position:static">
    <div class="rail" id="rail" role="tablist" aria-label="Sections"></div>
  </div>
</header>

<div class="drawer" id="drawer">
  <div class="drawer-inner">
    <h3>Show or hide tabs</h3>
    <p>Hidden tabs keep their data — check one back on any time.</p>
    <div class="tabtoggles" id="tabtoggles"></div>
  </div>
</div>

<main class="page" id="main"></main>

<script>
/* ============================ storage ============================ */
var KEY = 'bench-v1';
var mem = null;
function readRaw(){
  try{ var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }
  catch(e){ return mem; }
}
function writeRaw(obj){
  mem = obj;
  try{ localStorage.setItem(KEY, JSON.stringify(obj)); }catch(e){}
}
var DEFAULTS = {
  courses:[], tas:[], assistants:[], outreach:[], students:[], todos:[],
  digest:{ journals:[
      'American Journal of Physics',
      'The Physics Teacher',
      'Physical Review Physics Education Research',
      'European Journal of Physics',
      'Physics Education',
      'Nuclear Instruments and Methods in Physics Research Section A'
    ],
    topics:['gamma spectroscopy','scintillation detector'],
    preprints:['physics education','undergraduate laboratory'],
    mailto:'', saved:[], marks:{}, issns:{}, window:14 },
  plans:{ weeks:{}, semesters:[], years:{} },
  namegame:{},
  survey:{columns:[]},
  hidden:[]
};
var DB = Object.assign({}, DEFAULTS, readRaw() || {});
DB.digest = Object.assign({}, DEFAULTS.digest, DB.digest || {});
DB.plans  = Object.assign({}, DEFAULTS.plans,  DB.plans  || {});
function save(){ writeRaw(DB); }
function uid(){ return 'x' + Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ============================ schema ============================ */
function courseOpts(){
  var o = [{v:'',l:'— none —'}];
  DB.courses.forEach(function(c){ o.push({v:c.id, l:(c.code||'Untitled') + (c.title? ' · '+c.title : '')}); });
  return o;
}
var TRAINING = ['Not started','Scheduled','Complete'];

var ENTITIES = {
  courses:{
    label:'Courses', icon:'📓', singular:'course', addLabel:'Add course',
    title:function(r){ return r.code || r.title || 'Untitled course'; },
    sub:function(r){ return [r.title && r.code ? r.title : '', r.term].filter(Boolean).join(' · '); },
    badge:function(r){ return r.enrolled ? {t:r.enrolled+' enrolled', c:''} : null; },
    fields:[
      {n:'code', l:'Course number', t:'text', half:true, ph:'PHYS 30310'},
      {n:'term', l:'Term', t:'text', half:true, ph:'Fall 2026'},
      {n:'title', l:'Title', t:'text'},
      {n:'meets', l:'Meets', t:'text', half:true, ph:'Tue/Thu 2:00–4:45'},
      {n:'room', l:'Room', t:'text', half:true, ph:'Nieuwland 123'},
      {n:'enrolled', l:'Enrollment', t:'number', half:true},
      {n:'cap', l:'Cap', t:'number', half:true},
      {n:'syllabus', l:'Syllabus link', t:'url'},
      {n:'units', l:'Lab units / weekly schedule', t:'list'},
      {n:'equipment', l:'Equipment to prep', t:'list'},
      {n:'notes', l:'Notes', t:'textarea'}
    ]
  },
  tas:{
    label:'TAs', icon:'🔬', singular:'TA', addLabel:'Add TA',
    title:function(r){ return r.name || 'Unnamed TA'; },
    sub:function(r){ return courseName(r.course); },
    badge:function(r){ return r.training ? {t:r.training, c: r.training==='Complete'?'ok':(r.training==='Scheduled'?'warn':'hot')} : null; },
    fields:[
      {n:'name', l:'Name', t:'text'},
      {n:'email', l:'Email', t:'email', half:true},
      {n:'phone', l:'Phone', t:'text', half:true},
      {n:'course', l:'Assigned course', t:'select', opts:courseOpts, half:true},
      {n:'hours', l:'Hours per week', t:'number', half:true},
      {n:'officeHours', l:'Office hours', t:'text'},
      {n:'training', l:'Safety training', t:'select', opts:function(){ return TRAINING.map(function(x){return {v:x,l:x};}); }, half:true},
      {n:'sections', l:'Sections covered', t:'text', half:true},
      {n:'duties', l:'Duties', t:'list'},
      {n:'notes', l:'Notes', t:'textarea'}
    ]
  },
  assistants:{
    label:'Lab assistants', icon:'🧰', singular:'assistant', addLabel:'Add assistant',
    title:function(r){ return r.name || 'Unnamed assistant'; },
    sub:function(r){ return [r.year, r.project].filter(Boolean).join(' · '); },
    badge:function(r){ return r.status ? {t:r.status, c: r.status==='Active'?'ok':(r.status==='Applicant'?'warn':'')} : null; },
    fields:[
      {n:'name', l:'Name', t:'text'},
      {n:'email', l:'Email', t:'email', half:true},
      {n:'year', l:'Year', t:'select', half:true, opts:function(){ return ['','First-year','Sophomore','Junior','Senior','Graduate'].map(function(x){return {v:x,l:x||'— none —'};}); }},
      {n:'status', l:'Status', t:'select', half:true, opts:function(){ return ['Applicant','Active','Alumni'].map(function(x){return {v:x,l:x};}); }},
      {n:'started', l:'Start date', t:'date', half:true},
      {n:'hours', l:'Hours per week', t:'number', half:true},
      {n:'pay', l:'Funding source', t:'text', half:true, ph:'Work-study, hourly, credit'},
      {n:'training', l:'Safety training', t:'select', opts:function(){ return TRAINING.map(function(x){return {v:x,l:x};}); }},
      {n:'project', l:'Project or bench', t:'text'},
      {n:'tasks', l:'Current tasks', t:'list'},
      {n:'notes', l:'Notes', t:'textarea'}
    ]

/* ============================ generic entity view ============================ */
/* ======================= roster import =======================
   Bulk-loads a class list: names from a pasted column or a CSV, photos from a
   picked folder, matched by normalised name. Everything happens in the browser
   — nothing is uploaded. */

var importing = false;
var impPhotos = [];   /* [{name, key, thumb}] once processed */
var impRows = [];     /* [{name, photoIdx, status}] after matching */
var impCourseId = ''; /* captured at match time — the form is gone by review */
var impNamesText = ''; /* kept so Back does not wipe what was pasted */

/* Strip accents and punctuation so "Alex González" and "AlexGonzalez" agree.
   NFD splits an accented letter into base + combining mark, and the [^a-z]
   filter then drops the mark along with spaces, hyphens and apostrophes. */
function normName(s){
  return String(s == null ? '' : s)
    .normalize('NFD')
    .toLowerCase().replace(/[^a-z]/g, '');
}
/* Match on first + last token only: photo filenames routinely drop middle names. */
function nameKey(n){
  var t = String(n).trim().split(/\s+/);
  return normName(t[0] + (t.length > 1 ? t[t.length - 1] : ''));
}
function prefixScore(a, b){
  var i = 0, m = Math.min(a.length, b.length);
  while(i < m && a[i] === b[i]) i++;
  return i / Math.max(a.length, b.length, 1);
}

/* Minimal CSV row splitter — handles quoted cells containing commas. */
function csvCells(line){
  var out = [], cur = '', q = false;
  for(var i = 0; i < line.length; i++){
    var c = line[i];
    if(q){
      if(c === '"' && line[i+1] === '"'){ cur += '"'; i++; }
      else if(c === '"'){ q = false; }
      else cur += c;
    } else if(c === '"'){ q = true; }
    else if(c === ','){ out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

function cleanName(s){
  s = String(s || '').replace(/\[CONFIDENTIAL\]/ig, '').replace(/\s+/g, ' ').trim();
  /* Banner-style "Last, First Middle" -> "First Middle Last" */
  if(s.indexOf(',') > -1){
    var p = s.split(',');
    if(p.length === 2 && p[0].trim() && p[1].trim()) s = p[1].trim() + ' ' + p[0].trim();
  }
  return s.replace(/\s+/g, ' ').trim();
}

function parseNames(text){
  var lines = String(text).split(/\r?\n/).map(function(l){ return l.trim(); })
    .filter(function(l){ return l.length; });
  if(!lines.length) return [];
  var cells = lines.map(csvCells);
  /* Pick the column: a header cell containing "name", else the first column. */
  var col = 0, start = 0;
  var head = cells[0].map(function(c){ return c.toLowerCase().trim(); });
  var hit = -1;
  head.forEach(function(h, i){ if(hit < 0 && /name/.test(h)) hit = i; });
  if(hit > -1){ col = hit; start = 1; }
  var out = [];
  for(var i = start; i < cells.length; i++){
    var n = cleanName(cells[i][col] !== undefined ? cells[i][col] : cells[i][0]);
    /* Drop obvious non-name rows carried over from a spreadsheet export. */
    if(!n) continue;
    if(!/[a-z]/i.test(n)) continue;
    if(out.indexOf(n) === -1) out.push(n);
  }
  return out;
}

/* ======================= survey import =======================
   Loads a survey export (Google Forms and similar) and attaches each student's
   answers to their record, so the Name game can quiz on them. Runs entirely in
   the browser like the roster import. */

var surveying = false;      /* false | true (form) | 'review' */
var svText = '';            /* pasted/loaded CSV, kept across Back */
var svTable = null;         /* {headers:[], rows:[[]]} */
var svCols = [];            /* [{idx, text, kind, distinct, use, matched}] */
var svMatches = [];         /* [{row, studentId, name, status}] */
var svCourseId = '';

/* Full CSV parse — quoted fields may contain commas AND newlines, which free
   text answers routinely do. csvCells() only handles a single line. */
function parseCsvTable(text){
  var rows = [], row = [], cur = '', q = false;
  var t = String(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for(var i = 0; i < t.length; i++){
    var c = t[i];
    if(q){
      if(c === '"' && t[i+1] === '"'){ cur += '"'; i++; }
      else if(c === '"'){ q = false; }
      else cur += c;
    }
    else if(c === '"'){ q = true; }
    else if(c === ','){ row.push(cur); cur = ''; }
    else if(c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  rows = rows.filter(function(r){ return r.some(function(x){ return String(x).trim(); }); });
  if(!rows.length) return null;
  return { headers: rows[0].map(function(h){ return String(h).trim(); }), rows: rows.slice(1) };
}

/* Decide how a column can be quizzed:
     who  - answers are near-unique, so "who said this?" is meaningful
     what - answers repeat, so ask what a named student answered and offer the
            distinct values as choices
     none - unusable (everyone identical, too few answers, or long AND repetitive) */
/* Answers that decline to say anything. Not a length rule — "Radio" and
   "she/her" are short and worth quizzing on. Mirrored in names.html, which
   applies the same test when choosing which question to ask about a student. */
var DECLINE = ['na','n/a','n/a.','notapplicable','none','nothing','nil','null'];
function normAns(v){ return String(v == null ? '' : v).toLowerCase().replace(/[^a-z0-9/]/g, ''); }
function isDecline(v){
  var s = String(v == null ? '' : v).trim();
  if(!s) return true;
  if(!/[a-z0-9]/i.test(s)) return true;
  if(DECLINE.indexOf(normAns(s)) > -1) return true;
  if(s.length <= 24 && DECLINE.indexOf(normAns(String(s).split(/[,;.!\n]/)[0])) > -1) return true;
  return false;
}

/* pairs: [{v: answer, name: that student's name}] — the name is needed to spot
   questions whose answers give the answer away ("what name do you go by?"). */
function classifyColumn(pairs){
  /* Declines are not answers: counting them would make a mostly-empty column
     look distinctive, and they are never asked about anyway. */
  var use = pairs.filter(function(p){ return p.v && !isDecline(p.v); })
                 .map(function(p){ return {v:String(p.v).trim(), name:p.name || ''}; });
  if(use.length < 3) return {kind:'none', reason:'fewer than 3 real answers', distinct:[]};
  var distinct = [];
  use.forEach(function(p){ if(distinct.indexOf(p.v) === -1) distinct.push(p.v); });
  if(distinct.length < 2) return {kind:'none', reason:'everyone answered the same', distinct:distinct};

  var ratio = distinct.length / use.length;
  var avgLen = use.reduce(function(a, p){ return a + p.v.length; }, 0) / use.length;

  /* Would "who said this?" be trivial because the answer contains the name? */
  var leaks = 0;
  use.forEach(function(p){
    var toks = String(p.name).trim().split(/\s+/).map(normName).filter(function(t){ return t.length > 2; });
    var a = normName(p.v);
    if(toks.some(function(t){ return a.indexOf(t) > -1; })) leaks++;
  });
  var leaky = use.length && (leaks / use.length) >= 0.4;

  if(ratio >= 0.8 && distinct.length >= 4){
    if(leaky) return {kind:'who', distinct:distinct, leaky:true,
      reason:'answers usually contain the student’s own name'};
    return {kind:'who', distinct:distinct, ratio:ratio};
  }
  /* Long values are fine as choices — they render one per row. */
  if(avgLen <= 200) return {kind:'what', distinct:distinct, ratio:ratio};
  return {kind:'none', reason:'long answers that still repeat', distinct:distinct};
}

/* Google Forms writes "Name (Last, First)" and "Email Address"; be liberal. */
function findCol(headers, res){
  for(var i = 0; i < headers.length; i++){
    for(var r = 0; r < res.length; r++){ if(res[r].test(headers[i])) return i; }
  }
  return -1;
}

function buildSurveyPlan(){
  var headers = svTable.headers, rows = svTable.rows;
  var emailIdx = findCol(headers, [/^e-?mail/i, /email address/i]);
  var nameIdx  = findCol(headers, [/^name/i, /student name/i, /full name/i]);

  /* Match each response row to a student in the chosen course. */
  var roster = DB.students.filter(function(s){ return s.course === svCourseId; });
  svMatches = rows.map(function(r, ri){
    var st = null, how = '';
    if(emailIdx > -1 && String(r[emailIdx] || '').trim()){
      var em = String(r[emailIdx]).trim().toLowerCase();
      st = roster.filter(function(s){ return String(s.email || '').trim().toLowerCase() === em; })[0] || null;
      if(st) how = 'email';
    }
    if(!st && nameIdx > -1){
      var nm = cleanName(r[nameIdx]);
      var k = nameKey(nm);
      st = roster.filter(function(s){ return nameKey(s.name || '') === k; })[0] || null;
      if(st) how = 'name';
      if(!st){
        /* Same near-miss tolerance the photo matcher uses. */
        var best = null, bs = 0;
        roster.forEach(function(s){
          var sc = prefixScore(k, nameKey(s.name || ''));
          if(sc > bs){ bs = sc; best = s; }
        });
        if(best && bs >= 0.8){ st = best; how = 'near match'; }
      }
    }
    return {
      row: ri,
      label: (nameIdx > -1 ? cleanName(r[nameIdx]) : '') ||
             (emailIdx > -1 ? String(r[emailIdx] || '') : 'Response ' + (ri + 1)),
      studentId: st ? st.id : '',
      studentName: st ? st.name : '',
      how: how
    };
  });

  /* Classify every column that carries an actual answer. Canvas's Student
     Analysis Report interleaves a points column (headed with the points
     possible, e.g. "0.0") after every question, and appends n correct /
     n incorrect / score; Google Forms adds a Timestamp. None are questions. */
  var SKIP = /^(timestamp|name|id|sis_?id|section|section_?id|section_?sis_?id|submitted|attempt|n\s*correct|n\s*incorrect|score|points|total)$/i;
  svCols = [];
  headers.forEach(function(h, ci){
    if(ci === emailIdx || ci === nameIdx) return;
    var head = String(h || '').trim();
    if(!head) return;
    if(SKIP.test(head)) return;
    if(/^[\d.]+$/.test(head)) return;                     /* points column */
    var matched = svMatches.filter(function(m){ return m.studentId; });
    var pairs = matched.map(function(m){
      return { v: rows[m.row][ci], name: m.studentName };
    });
    var cls = classifyColumn(pairs);
    svCols.push({
      idx: ci,
      /* Canvas prefixes every question with its numeric id. */
      text: head.replace(/^\d+:\s*/, ''),
      kind: cls.kind,
      reason: cls.reason || '',
      leaky: !!cls.leaky,
      distinct: cls.distinct || [],
      /* A leaky column stays available but is off unless deliberately chosen. */
      use: cls.kind !== 'none' && !cls.leaky
    });
  });
}

function commitSurvey(){
  var rows = svTable.rows;
  var snapshot = JSON.stringify(DB.survey || null);
  DB.survey = DB.survey || {columns:[]};
  /* Re-importing the same survey replaces its questions rather than piling up
     duplicates: a column is identified by its text plus its course. */
  svCols.filter(function(c){ return c.use; }).forEach(function(c){
    var responses = {};
    svMatches.forEach(function(m){
      if(!m.studentId) return;
      var v = String(rows[m.row][c.idx] == null ? '' : rows[m.row][c.idx]).trim();
      if(v) responses[m.studentId] = v;
    });
    if(Object.keys(responses).length < 2) return;
    var rec = {
      id: uid(),
      course: svCourseId,
      text: c.text,
      kind: c.kind,
      responses: responses
    };
    var at = -1;
    DB.survey.columns.forEach(function(x, i){
      if(x.course === svCourseId && x.text === c.text) at = i;
    });
    if(at > -1) DB.survey.columns[at] = rec; else DB.survey.columns.push(rec);
  });
  if(!saveGuarded()){
    DB.survey = snapshot === 'null' ? {columns:[]} : JSON.parse(snapshot);
    save();
    alert('Out of browser storage — the survey was not saved.');

function processPhotos(files, onProgress, done){
  impPhotos = [];
  var i = 0;
  if(!files.length){ done(); return; }
  function step(){
    if(i >= files.length){ done(); return; }
    var f = files[i];
    shrinkImage(f, 160, function(thumb, err){
      /* A file that will not decode is simply skipped — it just stays unmatched. */
      if(!err && thumb){
        impPhotos.push({ name:f.name, key:normName(f.name.replace(/\.[^.]+$/, '')), thumb:thumb });
      }
      i++; onProgress(i, files.length); step();
    });
  }
  step();
}

function matchRoster(names){
  impRows = [];
  var used = {};
  names.forEach(function(n){
    var k = nameKey(n);
    var idx = -1, status = 'none';
    for(var i = 0; i < impPhotos.length; i++){
      if(used[i]) continue;
      if(impPhotos[i].key === k){ idx = i; status = 'exact'; break; }
    }
    if(idx < 0){
      var bs = 0, bi = -1;
      for(var j = 0; j < impPhotos.length; j++){
        if(used[j]) continue;
        var sc = prefixScore(k, impPhotos[j].key);
        if(sc > bs){ bs = sc; bi = j; }
      }
      if(bi > -1 && bs >= 0.75){ idx = bi; status = 'fuzzy'; }
    }
    if(idx > -1) used[idx] = true;
    /* Flag names already on the roster for this course so we do not duplicate them. */
    var dupe = DB.students.some(function(s){
      return s.course === impCourseId && normName(s.name) === normName(n);
    });
    impRows.push({ name:n, photoIdx:idx, status:status, dupe:dupe, skip:dupe });
  });
}

    DB.students.push(rec);

function groupHalves(container){
  var kids = Array.prototype.slice.call(container.children);
  var i = 0;
  while(i < kids.length - 1){
    if(kids[i].dataset && kids[i].dataset.half === '1' && kids[i+1].dataset && kids[i+1].dataset.half === '1'){
      var wrap = document.createElement('div');
      wrap.className = 'grid2';
      container.insertBefore(wrap, kids[i]);
      wrap.appendChild(kids[i]); wrap.appendChild(kids[i+1]);
      i += 2;
    } else { i += 1; }
  }
}

  if(f.t === 'list'){

  var el;
  if(f.t === 'textarea'){ el = document.createElement('textarea'); }
  else if(f.t === 'select'){
    el = document.createElement('select');
    (typeof f.opts === 'function' ? f.opts() : f.opts).forEach(function(o){
      var op = document.createElement('option');

  el.oninput = function(){ rec[f.n] = el.value; save(); };

function photoField(rec, f, key){
  var box = document.createElement('div');
  box.className = 'photofield';

  var file = document.createElement('input');
  file.type = 'file'; file.accept = 'image/*';
  file.id = 'f_' + rec.id + '_' + f.n;
  var rm = document.createElement('button');
  rm.type = 'button'; rm.className = 'btn'; rm.textContent = 'Remove';
  var note = document.createElement('div');
  note.className = 'photo-note';
  var failed = false;

  function draw(){
    if(rec[f.n]){
      img.src = rec[f.n]; img.style.display = ''; rm.style.display = '';
    } else {
      img.removeAttribute('src'); img.style.display = 'none'; rm.style.display = 'none';
    }
    if(!failed) note.textContent = rec[f.n] ? '' : 'Used by the Name game. Cropped square and stored on this device only.';
  }

  file.onchange = function(){
    var fl = file.files && file.files[0];
    if(!fl) return;
    failed = false; note.textContent = 'Processing…';
    shrinkImage(fl, 160, function(dataUrl, err){
      file.value = '';
      if(err){ failed = true; note.textContent = err; return; }
      var prev = rec[f.n];
      rec[f.n] = dataUrl;
      if(!saveGuarded()){
        rec[f.n] = prev;

        draw(); return;

      failed = false; draw(); renderListOnly(key);

  rm.onclick = function(){ rec[f.n] = ''; failed = false; save(); draw(); renderListOnly(key); };

  var ctrls = document.createElement('div');
  ctrls.className = 'photo-ctrls';
  ctrls.appendChild(file); ctrls.appendChild(rm);
  box.appendChild(img); box.appendChild(ctrls); box.appendChild(note);
  draw();
  return box;
}

/* Center-crops to a square and re-encodes small, so a roster of photos
   stays well inside the local-storage budget. */
function shrinkImage(fl, size, cb){
  /* Trust the extension when the OS reports no MIME type — Windows often hands
     back an empty type for .jfif. A file that really is not an image then fails
     to decode below, which is reported just the same. */
  var looksImage = /^image\//.test(fl.type) ||
    (!fl.type && /\.(jpe?g|jfif|png|gif|webp|bmp)$/i.test(fl.name));
  if(!looksImage){ cb(null, 'That file is not an image.'); return; }
  var fr = new FileReader();
  fr.onerror = function(){ cb(null, 'Could not read that file.'); };
  fr.onload = function(){
    var im = new Image();
    im.onerror = function(){ cb(null, 'Could not decode that image.'); };
    im.onload = function(){
      var s = Math.min(im.width, im.height);
      if(!s){ cb(null, 'That image has no dimensions.'); return; }
      var c = document.createElement('canvas');
      c.width = size; c.height = size;
      var ctx = c.getContext('2d');
      ctx.drawImage(im, (im.width - s)/2, (im.height - s)/2, s, s, 0, 0, size, size);
      try{ cb(c.toDataURL('image/jpeg', 0.82), null); }
      catch(e){ cb(null, 'Could not process that image.'); }
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(fl);
}

/* Like save(), but reports a quota failure instead of swallowing it —
   photos are big enough to actually hit the cap. */
function saveGuarded(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); mem = DB; return true; }

}

      var x = document.createElement('button'); x.className = 'x'; x.type = 'button';
      x.innerHTML = '&times;'; x.title = 'Remove item';

    var addRow = document.createElement('div');
    addRow.className = 'check';

    addBtn.onclick = function(){
      items.push({t:'', d:false}); save(); draw();

      if(inputs.length) inputs[inputs.length-1].focus();
    };
    addRow.appendChild(addBtn);
    box.appendChild(addRow);
  }
  draw();
  return box;
}

/* One result row: title link, metadata, and the read / not-interested / save
   actions. Marks live in DB.digest.marks keyed by artKey so they survive a
   refetch — the same paper keeps its state next time it comes back. */
function articleCard(a, d){
  var key = artKey(a);
  var mark = d.marks[key] || '';
  var savedIdx = d.saved.map(function(x){ return artKey(x); }).indexOf(key);

  var el = document.createElement('div');

    '<div class="artmeta"><span>' + esc(a.authors) + '</span><span>' + esc(a.journal) + '</span>' +
    '<span>' + esc(a.date) + '</span></div>';

  var acts = document.createElement('div');

  function markBtn(value, glyph, onLabel, offLabel){
    var b = document.createElement('button');

    b.innerHTML = glyph;
    b.title = mark === value ? onLabel : offLabel;

    b.onclick = function(){

      if(d.marks[key] === value) delete d.marks[key];
      else d.marks[key] = value;
      save(); renderMain();

  }
  acts.appendChild(markBtn('read', '&#10003;', 'Marked read — click to clear', 'Mark as read'));
  acts.appendChild(markBtn('skip', '&#10005;', 'Marked not interested — click to clear', 'Not interested'));

  var h = document.createElement('button');
  h.className = 'mbtn heart' + (savedIdx > -1 ? ' on' : '');
  h.type = 'button'; h.innerHTML = '&#9829;';
  h.title = savedIdx > -1 ? 'Remove from saved' : 'Save for later';
  h.setAttribute('aria-pressed', savedIdx > -1 ? 'true' : 'false');
  h.setAttribute('aria-label', (savedIdx > -1 ? 'Remove from saved' : 'Save for later') + ': ' + a.title);
  h.onclick = function(){
    var i2 = d.saved.map(function(x){ return artKey(x); }).indexOf(key);
    if(i2 > -1) d.saved.splice(i2,1); else d.saved.push(a);

/* The three source kinds, flattened in the order their chips appear. */
function digestSections(){
  var d = DB.digest, out = [];
  (d.journals || []).forEach(function(n){ out.push({name:n, kind:'journal'}); });
  (d.topics || []).forEach(function(n){ out.push({name:n, kind:'topic'}); });
  (d.preprints || []).forEach(function(n){ out.push({name:n, kind:'preprint'}); });
  return out;
}

/* Stable per-article key for read/skip/save state. CrossRef always has a DOI;
   OpenAlex preprints may not, so fall back to the OpenAlex work id. */
function artKey(a){ return a.doi || a.id || a.url; }

function daysAgoISO(n){
  var t = new Date();
  t.setDate(t.getDate() - n);
  return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
}

function mailtoParam(){
  var m = DB.digest.mailto;
  return m ? '&mailto=' + encodeURIComponent(m) : '';
}

/* CrossRef's query.container-title is a fuzzy search: asking it for "American
   Journal of Physics" happily returns the American Ceramic Society. Resolving
   the title to an ISSN first and querying /journals/{issn}/works is exact.
   Results are cached in DB.digest.issns so this costs one extra call per
   journal, once. */
function resolveIssn(name, cb){
  var d = DB.digest;
  d.issns = d.issns || {};
  if(d.issns[name]){ cb(d.issns[name].issn, d.issns[name].title); return; }
  fetch('https://api.crossref.org/journals?rows=6&query=' + encodeURIComponent(name) + mailtoParam())
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){
      var want = normName(name), best = null, bestScore = -1;
      ((j.message && j.message.items) || []).forEach(function(it){
        var issn = (it.ISSN || [])[0];
        if(!issn) return;
        var got = normName(it.title || ''), sc;
        /* Exact beats prefix beats substring beats fuzzy — CrossRef's own
           ranking puts "Educational Physics" above "Physics Education". */
        if(got === want) sc = 3;
        else if(got.indexOf(want) === 0) sc = 2;
        else if(got.indexOf(want) > -1) sc = 1;
        else sc = prefixScore(want, got);
        if(sc > bestScore){ bestScore = sc; best = {issn:issn, title:it.title || name}; }
      });
      if(!best) throw new Error('no matching journal');
      d.issns[name] = best; save();
      cb(best.issn, best.title);
    })
    .catch(function(e){ cb(null, null, e); });
}

/* OpenAlex keeps two records per arXiv paper — one carrying a 10.48550/arxiv
   DOI and one without — so keying on id alone leaves visible duplicates.
   Collapse on normalised title too, preferring the record with a DOI. */
function dedupeArticles(items){
  var byTitle = {}, order = [];
  items.forEach(function(a){
    var k = artKey(a);
    if(!k) return;
    var t = normName(a.title);
    if(!t){ order.push(k); byTitle[k] = a; return; }
    var prev = byTitle[t];
    if(!prev){ order.push(t); byTitle[t] = a; return; }
    if(!prev.doi && a.doi) byTitle[t] = a;   /* keep the more canonical record */
  });
  return order.map(function(t){ return byTitle[t]; }).filter(Boolean);
}

function runDigestFetch(url, kind, sourceLabel){
  fetch(url).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(j){
    var items = kind === 'openalex' ? mapOpenAlex(j) : mapCrossref(j);
    digestState.results = dedupeArticles(items);
    digestState.source = sourceLabel;
    digestState.loading = false; renderMain();
  }).catch(function(err){
    digestState.loading = false;
    digestState.error = 'Could not reach ' + (kind === 'openalex' ? 'OpenAlex' : 'CrossRef') +
      '. Check the connection and press Refresh. (' + (err.message || String(err)) + ')';
    renderMain();
  });
}

function loadDigest(){
  var d = DB.digest;
  var sec = digestSections()[digestState.active];
  if(!sec){ renderMain(); return; }
  var fromStr = daysAgoISO(d.window);
  var todayStr = daysAgoISO(0);
  digestState.loading = true; digestState.error = ''; digestShowHidden = false; renderMain();

  if(sec.kind === 'preprint'){
    /* arXiv sends no CORS headers, so it cannot be called from a page at all.
       OpenAlex can, and indexes arXiv — S4306400194 is arXiv as a source.
       Relevance ordering (OpenAlex's default) beats date ordering here; the
       date filter already limits the window. */
    runDigestFetch(
      'https://api.openalex.org/works' +
      '?filter=primary_location.source.id:S4306400194' +
      ',from_publication_date:' + fromStr +
      ',to_publication_date:' + todayStr +
      '&search=' + encodeURIComponent(sec.name) +
      '&per-page=25' + mailtoParam(),
      'openalex', 'OpenAlex · arXiv');
    return;
  }

  if(sec.kind === 'journal'){
    resolveIssn(sec.name, function(issn, title, err){
      if(!issn){
        digestState.loading = false;
        digestState.error = 'CrossRef has no journal matching “' + sec.name +
          '”. Check the spelling in settings — it needs the journal’s full title.';
        renderMain(); return;
      }
      runDigestFetch(
        'https://api.crossref.org/journals/' + encodeURIComponent(issn) +
        '/works?rows=25&sort=published&order=desc' +
        '&filter=from-pub-date:' + fromStr + ',until-pub-date:' + todayStr + mailtoParam(),
        'crossref', 'CrossRef · ' + title);
    });
    return;
  }

  /* Keyword topic across all of CrossRef. until-pub-date matters: without it,
     records stamped with far-future dates sort straight to the top. */
  runDigestFetch(
    'https://api.crossref.org/works?rows=25&sort=published&order=desc' +
    '&filter=from-pub-date:' + fromStr + ',until-pub-date:' + todayStr +
    '&query.bibliographic=' + encodeURIComponent(sec.name) + mailtoParam(),
    'crossref', 'CrossRef');
}

/* CrossRef titles carry MathML and formatting markup; strip it so the list
   does not show stray tag fragments. */
function plainTitle(t){
  return String(t == null ? '' : t)
    .replace(/<[^>]*>/g, '')
    .replace(/\s+/g, ' ')
    .trim() || 'Untitled';
}

function mapCrossref(j){
  return ((j.message && j.message.items) || []).map(function(it){
    var au = (it.author || []).slice(0,3).map(function(a){
      return [a.given, a.family].filter(Boolean).join(' ');
    }).join(', ');
    if((it.author || []).length > 3) au += ' et al.';
    var parts = ((it.published && it.published['date-parts']) || [[]])[0] || [];
    return {
      doi: it.DOI,
      title: plainTitle(Array.isArray(it.title) ? it.title[0] : it.title),
      authors: au || 'No listed authors',
      journal: (it['container-title'] || [])[0] || '',
      date: parts.join('-'),
      url: it.URL || ('https://doi.org/' + it.DOI)
    };
  });
}

function mapOpenAlex(j){
  return (j.results || []).map(function(w){
    var names = (w.authorships || []).slice(0,3).map(function(a){
      return (a.author && a.author.display_name) || '';
    }).filter(Boolean);
    var au = names.join(', ');
    if((w.authorships || []).length > 3) au += ' et al.';
    var loc = w.primary_location || {};
    /* OpenAlex names the source "arXiv (Cornell University)"; the parenthetical
       just costs room in a one-line metadata row. */
    var src = ((loc.source && loc.source.display_name) || 'arXiv').replace(/\s*\(.*\)\s*$/, '');
    return {
      id: w.id,
      doi: w.doi || '',
      title: plainTitle(w.title || w.display_name),
      authors: au || 'No listed authors',
      journal: src,
      date: w.publication_date || '',
      url: loc.landing_page_url || w.doi || w.id
    };
  });
}

/* ============================ shell ============================ */
function renderMain(){
  var main = document.getElementById('main');
  main.innerHTML = '';
  if(current === 'students' && importing === 'review'){ renderReview(); return; }
  if(current === 'students' && importing){ renderImport(); return; }
  if(current === 'students' && surveying === 'review'){ renderSurveyReview(); return; }
  if(current === 'students' && surveying){ renderSurveyImport(); return; }
  if(ENTITIES[current]) renderEntity(current);
  else if(current === 'todo') renderTodo();
  else if(current === 'plans') renderPlans();
  else if(current === 'digest') renderDigest();
}

document.getElementById('settingsBtn').onclick = function(){
  var dr = document.getElementById('drawer');
  var open = dr.classList.toggle('open');
  this.setAttribute('aria-expanded', open ? 'true' : 'false');
};
document.getElementById('exportBtn').onclick = function(){
  var blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'teaching-workspace-backup-' + todayISO() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById('importBtn').onclick = function(){ document.getElementById('importFile').click(); };
document.getElementById('importFile').onchange = function(e){
  var f = e.target.files[0];
  if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var obj = JSON.parse(fr.result);
      if(!confirm('Replace everything currently in this browser with the file contents?')) return;
      DB = Object.assign({}, DEFAULTS, obj);
      DB.digest = Object.assign({}, DEFAULTS.digest, DB.digest || {});
      DB.plans  = Object.assign({}, DEFAULTS.plans,  DB.plans  || {});
      save(); renderToggles(); renderRail(); renderMain();
    }catch(err){ alert('That file is not a valid backup: ' + err.message); }
  };
  fr.readAsText(f);
};

renderToggles();
renderRail();
renderMain();
</script>
